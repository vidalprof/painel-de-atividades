<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atividades — E.B.M. Vidal Ramos</title>
<meta name="theme-color" content="#1d3557">
<style>
:root{
  --fundo:#f4f1ec; --papel:#fffdfa; --tinta:#22201c; --fraco:#6b6459;
  --linha:#e3ddd2; --azul:#1d3557; --azul-c:#2a4d78; --ok:#2f7d52;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fundo);color:var(--tinta);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--azul);color:#fff;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
h1{margin:0 0 8px;font-size:17px;letter-spacing:.2px}
h1 small{display:block;font-weight:400;font-size:12px;opacity:.8;letter-spacing:0}
#busca{width:100%;padding:11px 12px;border:0;border-radius:10px;font-size:16px;
  background:#fff;color:var(--tinta)}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid rgba(255,255,255,.45);background:transparent;
  color:#fff;border-radius:99px;padding:0 15px;min-height:40px;min-width:40px;font-size:14.5px;
  font-weight:600;cursor:pointer}
  /* ⚠️ 40px é o piso da casa para alvo de dedo (o `_qa/leiaute.js` reprova
     abaixo disso). Com `padding:6px` os chips davam 31px e o Marcos erraria a
     turma no celular — justamente o gesto que ele mais vai usar aqui. */
.chip[aria-pressed="true"]{background:#fff;color:var(--azul);border-color:#fff}
main{padding:12px 12px 40px;max-width:820px;margin:0 auto}
/* ⭐ O CONTROLE DA SALA AO LADO (pedido do Marcos, set/2026: *"tem como o
   controle da sala ser no mesmo painel de atividades?... é mais fácil para
   copiar e colar os links"* e *"o painel de controle é bem pequeno, daria para
   ficar à direita do outro painel, pq tem espaço"*).

   Ele COPIA o link de uma atividade aqui e COLA no controle para mandar às
   máquinas da sala. Eram duas abas; agora é uma tela: lista à esquerda,
   controle à direita.

   ⚠️ O CONTROLE NÃO MUDA UMA LINHA. Ele entra por `<iframe>` apontando para o
   endereço dele mesmo (`controle-lab/controle.html`), que continua funcionando
   sozinho, no mesmo link de sempre. Duas coisas tornam isso seguro, e as duas
   foram conferidas no arquivo dele:
     · o `controle.html` não tem NENHUMA chamada que navegue a janela
       (`window.top`, `location.href=`, `window.open`) — quem tem é o
       `index.html`, que é a tela da MÁQUINA DO ALUNO, e essa não entra aqui;
     · painel e controle moram no MESMO domínio (vidalprof.github.io), então já
       hoje dividem o mesmo localStorage: embutir não muda nada nisso.
   Ele já nasce estreito (`max-width:460px` no CSS dele) — cabe na faixa. */
#corpo{display:block}
#sala{display:none}
#btsala{display:none}
/* ⚠️ O CORTE É 980px, não 1040: o netbook da escola tem 1024 de largura, e é
   justamente nele que ele usa o controle. Com 1040 a coluna sumiria lá. Em 1024
   a faixa fica com 430px (o controle já nasce com max-width:460) e a lista com
   o resto — medido, sem rolagem lateral. */
@media (min-width:980px){
  /* a página inteira vira aplicativo: o cabeçalho fica, e só a LISTA rola.
     Assim o controle da direita não sai da tela quando ele procura a atividade. */
  html,body{height:100%}
  body{display:-webkit-box;display:flex;-webkit-box-orient:vertical;
    flex-direction:column;overflow:hidden}
  header{position:static;-webkit-box-flex:0;flex:0 0 auto}
  /* ⚠️ SEM `max-width` E SEM `margin:0 auto` — de propósito (pedido do Marcos,
     set/2026: *"pode jogar a lista de atividades mais pra esquerda, bem no
     começo, assim sobra mais espaço para o painel e a lista que vc citou"*).
     Antes o conteúdo era uma coluna de 1460px CENTRADA: num monitor de 1920 isso
     jogava 230px de vazio de cada lado e empurrava a lista para o meio da tela.
     Agora a lista começa na borda esquerda (só o respiro de 10px) e TODA a
     largura da tela é dividida entre lista e controle. */
  #corpo{-webkit-box-flex:1;flex:1 1 auto;display:-webkit-box;display:flex;
    min-height:0;gap:14px;margin:0;width:100%;padding:12px 12px 12px 10px}
  main{-webkit-box-flex:1;flex:1 1 auto;min-height:0;overflow-y:auto;
    max-width:none;padding:0 4px 24px;margin:0}
  #sala{display:-webkit-box;display:flex;-webkit-box-orient:vertical;
    flex-direction:column;-webkit-box-flex:0;flex:0 0 430px;min-height:0}
  #sala h3{margin:0 0 7px;font-size:13px;text-transform:uppercase;
    letter-spacing:1px;color:var(--fraco);font-weight:700}
  /* alvo de dedo: o link "abrir sozinho" tinha 17px de altura (medido pelo
     _qa/leiaute_mao.js, set/2026) — ganha area de toque de 40px sem mudar o desenho */
  #sala h3 a{color:var(--azul-c);text-decoration:none;font-size:12px;
    text-transform:none;letter-spacing:0;float:right;font-weight:600;
    display:inline-block;padding:12px 8px;margin:-12px -8px -12px 0;line-height:16px}
  #sala iframe{-webkit-box-flex:1;flex:1 1 auto;width:100%;border:0;
    border-radius:14px;background:#0c1730;
    -webkit-box-shadow:0 4px 14px rgba(90,60,20,.16);
    box-shadow:0 4px 14px rgba(90,60,20,.16)}
}
/* ⚠️ TELA BAIXA (o netbook de 600px de altura): o cabeçalho comia 172 dos 600,
   e sobravam 416 para a lista E para o controle. Cada pixel tirado daqui vira
   pixel útil nos dois. Mesma lição do Pinta e Monta. */
@media (min-width:980px) and (max-height:700px){
  header{padding:6px 12px}
  h1{font-size:15px;margin-bottom:5px}
  h1 small{font-size:11px}
  #busca{padding:11px 12px;font-size:15px;min-height:40px}
  #chips{padding:6px 0 0}
  .chip{padding:0 12px}      /* mais estreito, mas os 40px de ALTURA ficam */
  #corpo{padding:8px 12px 8px 10px}
  .card{padding:9px 11px;margin-bottom:7px}
  .trab{margin-bottom:7px}
}
/* ⚠️ E o que eu NÃO encolhi, de propósito: a ALTURA dos chips e dos botões.
   Na primeira tentativa apertei os dois e ganhei 34px — ao preço de 12 alvos
   abaixo dos 40px que a casa exige para o dedo. Espaço se tira do título e do
   respiro, nunca do que a pessoa precisa acertar. */
/* ⚠️ O CONTROLE NÃO GANHA MAIS DO QUE USA (ajuste do Marcos: *"redistribua
   melhor a tela"*). O CSS dele é `max-width:460px` — dar 560 desperdiçava 100px
   de faixa vazia enquanto a lista de atividades ficava apertada. O teto é 470
   (460 + a folga da barra de rolagem); daí para cima, tudo o que sobra vai para
   as atividades, que é onde ele procura e copia. */
@media (min-width:1200px){ #sala{-webkit-box-flex:0;flex:0 0 470px} }
/* ⭐ E no monitor grande o controle CRESCE de verdade (não é faixa vazia): o
   `.wrap` do próprio `controle.html` passou a 560px, então a partir de 1520 de
   largura a coluna vai a 580 e o controle usa isso — campo do alvo mais largo,
   botões maiores e a lista "JÁ TERMINARAM" cabendo numa linha só. */
@media (min-width:1520px){ #sala{-webkit-box-flex:0;flex:0 0 580px} }
/* ⚠️ A LISTA É UMA COLUNA VERTICAL — e isso é escolha, não sobra.
   Eu tinha posto a lista em GRADE de 2/3 colunas no monitor grande, achando que
   ver 15 atividades de uma vez ajudaria. O Marcos olhou e disse: *"acho que
   você podia deixar a lista da esquerda como estava, na vertical, desse jeito
   ocupa muito espaço"*. Ele tem razão pelo uso real: ele varre a coluna de cima
   para baixo procurando UMA atividade e copia o link — a grade obriga o olho a
   ziguezaguear e espalha a divisão por turma.
   Então a coluna volta, e a largura que sobra no monitor grande vai para o
   CONTROLE (que é o que ele usa ao lado), não para esticar cartão. */
@media (min-width:1360px){
  main{max-width:700px}                 /* a coluna de leitura, encostada à esquerda */
  /* ⚠️ e o controle OCUPA o resto, em vez de deixar um vazio claro do lado
     direito: com as duas colunas travadas sobrava meia tela de fundo liso, que
     lê como página quebrada. O `.wrap` do controle vai até 720px, então ele
     cresce de verdade dentro dessa faixa (campo e botões maiores). */
  #sala{-webkit-box-flex:1;flex:1 1 auto;min-width:0}
}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--fraco);
  margin:20px 0 8px;font-weight:700}
h2:first-of-type{margin-top:4px}
.card{background:var(--papel);border:1px solid var(--linha);border-radius:12px;
  padding:11px 12px;margin-bottom:9px}
.nome{font-weight:700;font-size:16px;margin-bottom:2px}
.trab{color:var(--fraco);font-size:13.5px;margin-bottom:9px}
.acoes{display:flex;gap:7px;flex-wrap:wrap}
.bt{flex:1 1 auto;min-width:120px;text-align:center;text-decoration:none;
  border:1px solid var(--linha);border-radius:9px;padding:11px 10px;
  font-size:14.5px;font-weight:700;cursor:pointer;background:#fff;color:var(--azul)}
.bt.abrir{background:var(--azul);color:#fff;border-color:var(--azul)}
.bt.prof{flex:0 0 auto;min-width:0;color:var(--azul-c)}
.bt.copiado{background:var(--ok);color:#fff;border-color:var(--ok)}
.semlink{color:var(--fraco);font-size:13.5px;font-style:italic}
/* ⭐ O PLANO DE AULA (pedido do Marcos, 21/set/2026: *"ter o tema e objetivo da
   aula, para que eu possa copiar e colocar no planejamento online da agenda de
   aulas, quando o professor não o faz"*).
   ⚠️ NASCE FECHADO, de propósito. O painel é a tela que ele varre de cima para
   baixo procurando UMA atividade entre 99; se cada cartão abrisse com dez linhas
   de objetivo, a varredura morria. Aberto, ele só existe no cartão que ele
   escolheu. */
.plano{display:none;margin-top:9px;border-top:1px dashed var(--linha);padding-top:9px}
.plano.aberto{display:block}
.pcampo{margin-bottom:9px}
.prot{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;
  color:var(--fraco);font-weight:700;margin-bottom:3px}
.ptxt{background:#fbf8f2;border:1px solid var(--linha);border-radius:9px;
  padding:9px 10px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;
  word-wrap:break-word;overflow-wrap:break-word;max-height:220px;overflow:auto}
.ptxt.uma{white-space:normal;font-weight:600}
.semcur{color:#8a5a1d;font-size:12.5px;margin-bottom:8px;line-height:1.4}
#vazio{display:none;text-align:center;color:var(--fraco);padding:30px 10px}
#rodape{color:var(--fraco);font-size:12px;text-align:center;margin-top:22px}
@media (min-width:640px){ .bt{flex:0 0 auto;min-width:150px} }
</style>

rrada;\n• pontuar um texto inteiro do começo ao fim;\n• escolher o sinal que a cena pede.\n\nCurrículo de Blumenau — Língua Portuguesa · 2º ano · Análise linguística/semiótica (alfabetização) · Pontuação · Análise linguística/semiótica (compartilhada e autônoma) · Construção do sistema alfabético/convenções da escrita\n“Usar adequadamente ponto final, ponto de interrogação e ponto de exclamação.”\n“letras maiúsculas em início de frases e em substantivos próprios, segmentação entre as palavras, ponto final, ponto de interrogação e ponto de exclamação.”\n\nAtividade: https://vidalprof.github.io/a-casinha-dos-tres-pontos/", "curriculo": 1}, {"turma": "2º ano", "chip": "2º", "pos": 2, "nome": "A Cidade dos Sólidos", "trabalha": "Sólidos geométricos", "pasta": "_solidos", "link": "https://vidalprof.github.io/a-cidade-dos-solidos/", "painel": "", "tema": "A Cidade dos Sólidos", "objetivo": "Ao final da aula, o estudante deverá ser capaz de:\n• reconhecer e nomear os sólidos geométricos.\n\nCurrículo de Blumenau — Matemática · 2º ano · Geometria\n“Reconhecer, nomear e comparar figuras geométricas espaciais (cubo, bloco retangular, pirâmide, cone, cilindro e esfera), relacionando-as com objetos do mundo físico.”\n\nAtividade: https://vidalprof.github.io/a-cidade-dos-solidos/", "curriculo": 1}, {"turma": "2º ano", "chip": "2º", "pos": 2, "nome": "A Confeitaria do Cacau", "trabalha": "Matemática: multiplicação como adição de parcelas iguais (fatores 2, 3, 4 e 5), dobro e triplo, o caixa com moedas e \"você é o chefe\" — 25 telas com o mascote Cacau, narração e relatório do professor. É a Doceria do Cacau (3º ano) adequada ao 2º: mesmas dinâmicas e figuras, fatores dentro do teto do ano", "pasta": "_doce2", "link": "https://vidalprof.github.io/a-confeitaria-do-cacau/", "painel": "", "tema": "A Confeitaria do Cacau", "objetivo": "Ao final da aula, o estudante deverá ser capaz de:\n• multiplicar por 2, 3, 4 e 5 somando parcelas iguais;\n• achar o dobro e o triplo.\n\nCurrículo de Blumenau — Matemática · 2º ano · Números\n“Resolver e elaborar problemas de multiplicação (por 2, 3, 4 e 5) com a ideia de adição de parcelas iguais por meio de diferentes estratégias, dentre elas o cálculo mental, e formas de registro pessoais, utilizando ou não suporte de imagens e/ou material manipulável.”\n“Resolver e elaborar problemas envolvendo dobro, metade, triplo e terça parte, com o suporte de imagens ou material manipulável, utilizando estratégias pessoais, dentre elas o cálculo mental.”\n\nAtividade: https://vidalprof.github.io/a-confeitaria-do-cacau/", "curriculo": 1}, {"turma": "2º ano", "chip": "2º", "pos": 2, "nome": "A Feirinha da Dona Coruja", "trabalha": "Adição/subtração: juntar, acrescentar, separar, retirar, comparar (com digitar-resultado e arrastar)", "pasta": "_feirinha", "link": "https://vidalprof.github.io/feirinha-da-coruja/", "painel": "", "tema": "A Feirinha da Dona Coruja", "objetivo": "Ao final da aula, o estudante deverá ser capaz de:\n• juntar, acrescentar, separar e retirar.\n\nCurrículo de Blumenau — Matemática · 2º ano · Números\n“Resolver e elaborar problemas de adição e de subtração, envolvendo números de até três ordens, com os significados de juntar, acrescentar, separar e retirar, utilizando estratégias pessoais, dentre elas o cálculo mental.”\n\nAtividade: https://vidalprof.github.io/feirinha-da-coruja/", "curriculo": 1}, {"turma": "2º ano", "chip": "2º", "pos": 2, "nome": "A Máquina de Trocar Sílabas (livro de folhas · 2º ano)", "trabalha": "Português (alfabetização, EF02) — tirar, trocar, inverter e acrescentar sílabas, segundo dos dez cadernos do 2º ano. Blumenau: *“Segmentar palavras em sílabas e remover e substituir sílabas iniciais, mediais ou finais para criar novas palavras”*. 35 folhas em nove blocos: a máquina MONTA — escolher o final que forma a palavra, uma sílaba que serve para três palavras, a cor que mostra o par, pôr na ordem e as gotas de chuva (1-9); ACHA — marcar só as sílabas da palavra entre distratores cada vez mais parecidos (10-12); TIRA — remover uma letra e GRATO virar GATO (13-14); TROCA — a terminação parada e a letra da frente mudando, BOLA MOLA COLA, e a tira em que o fim LHA fica na janela (15-19); INVERTE — MUDA-SÍLABAS, puxar o pedaço de trás para a frente e CAMA virar MACA (20-22); ACRESCENTA — no fim e no começo (23-24); RECORTA — o fim de SAPO com o fim de LAÇO dá POÇO (25-26); o CÓDIGO — a sílaba vira número e a criança decifra (27-30); e a palavra no MUNDO — as duas pontas que faltam, começo/meio/fim nas gavetas, a palavra dentro da frase, o ditado em que um pedaço serve em três lugares e o cartaz que ela monta (31-35). ⭐ Nasceu do crivo de 40 folhas de papel reais (`_sequencias/POTE-TROCA2.md`), lidas uma a uma: o nome do caderno veio da folha “MUDA-SÍLABAS” e a tira que desliza, de outra. As 24 figuras foram recortadas das próprias folhas colhidas — nenhuma gerada por IA. As sílabas faladas são recortadas de dentro da gravação da palavra inteira, com alinhamento forçado: a voz nunca soletra. Voz em tudo e em toda opção de resposta, teclado na tela e de verdade, continua de onde parou por 55 min, chave 1275@. NÃO usa o motor (folha viva)", "pasta": "_troca2", "link": "https://vidalprof.github.io/a-maquina-de-trocar-silabas/", "painel": "", "tema": "A Máquina de Trocar Sílabas", "objetivo": "O que a aula trabalha:\n• Juntar sílabas e formar a palavra;\n• Pôr as sílabas na ordem certa da palavra;\n• Achar, entre muitas, só as sílabas da palavra;\n• Remover uma letra ou sílaba e formar outra palavra;\n• Substituir uma letra ou sílaba e formar outra palavra;\n• Inverter as sílabas e descobrir a palavra que nasce;\n• Acrescentar uma sílaba no começo ou no fim;\n• Ler por blocos: achar a sílaba pelo número no quadro;\n• Reconhecer a sílaba inicial, medial e final;\n• Levar a palavra para dentro da frase, e nomear as quatro mexidas.\n\nCurrículo de Blumenau — Língua Portuguesa · 2º ano · Análise linguística/semiótica (alfabetização) · Construção do sistema alfabético e da ortografia\n“Segmentar palavras em sílabas e remover e substituir sílabas iniciais, mediais ou finais para criar novas palavras.”\n\nAtividade: https://vidalprof.github.io/a-maquina-de-trocar-silabas/", "curriculo": 1}, {"turma": "2º ano", "chip": "2º", "pos": 2, "nome": "A Parlenda que Rima (livro de folhas · 2º ano)", "trabalha": "Português (alfabetização, EF02) — a rima dentro da parlenda e da quadrinha: verso, estrofe e rima, oitavo dos dez cadernos do 2º ano. Blumenau: *“Reconhecer, em textos versificados, rimas, sonoridades, jogos de palavras, palavras, expressões, comparações, relacionando-as com sensações e associações.”* 35 folhas em doze blocos: o FIM IGUAL — achar a palavra que termina com o mesmo pedacinho, com figura e sem (1-3); a PARLENDA COM UM PEDAÇO FALTANDO — completar o verso e puxar a palavra para dentro dele (4-6); ACHAR NO TEXTO — marcar as rimas em três parlendas inteiras (7-9); o VERSO — pôr os versos na ordem, ligar o começo ao fim, achar a palavra que fecha (10-12); ESCREVER a rima (13-15); o CAMINHO INVERSO — sem lista: a criança produz a rima (16-17); o INTRUSO (18); a FIGURA no lugar da palavra, o texto enigmático (19-21); ENTENDER o que a parlenda conta (22-24); os JOGOS — dois caça-rimas e a cruzadinha (25-27); CLASSIFICAR em duas e em três gavetas e marcar todas as que rimam (28-30); ⭐ TROCAR a rima e a parlenda continuar rimando (31-33); e a SUA quadrinha, até o cartaz em que os nomes RIMA, VERSO e ESTROFE aparecem pela primeira vez (34-35). ⭐ Nasceu do crivo de 40 folhas de papel reais (`_sequencias/POTE-RIMA2.md`). As nove parlendas são de domínio público e vieram das próprias folhas (Hoje é domingo · Meio-dia, macaca Sofia · Vaca amarela · A casinha da vovó · Corre cutia · Galinha choca · Um, dois, feijão com arroz · Batatinha quando nasce · Quem cochicha); os quatro textos com autoria que a colheita trouxe ficaram de fora — o gesto entra, o texto não. As 15 figuras foram recortadas das próprias folhas colhidas, e as sete de *Hoje é domingo* são os próprios pares que rimam. Identidade própria (portão 0b11): azul, capa com a corrente de rimas. Voz em tudo e em toda opção de resposta, teclado na tela e de verdade, continua de onde parou por 55 min, chave 1275@. NÃO usa o motor (folha viva)", "pasta": "_rima2", "link": "https://vidalprof.github.io/a-parlenda-que-rima/", "painel": "", "tema": "A Parlenda que Rima", "objetivo": "Ao final da aula, o estudante deverá ser capaz de:\n• reconhecer que duas palavras terminam com o mesmo som;\n• completar o verso com a palavra que rima;\n• achar as palavras que rimam dentro de uma parlenda;\n• reconhecer o verso como a linha da parlenda;\n• escrever a palavra que rima e fecha o verso;\n• produzir uma rima sem lista de opções;\n• distinguir o que rima do que não rima;\n• ler a figura no lugar da palavra dentro do verso;\n• compreender o que a parlenda conta;\n• achar as palavras que rimam nos jogos de letras;\n• trocar a rima mantendo o verso rimado;\n• escrever o próprio verso e nomear rima, verso e estrofe.\n\nCurrículo de Blumenau — Língua Portuguesa · 2º ano · Análise linguística/semiótica (alfabetização) · Formas de composição de textos poéticos\n“Reconhecer, em textos versificados, rimas, sonoridades, jogos de palavras, palavras, expressões, comparações, relacionando-as com sensações e associações.”\n\nAtividade: https://vidalprof.github.io/a-parlenda-que-rima/", "curriculo": 1}, {"turma": "2º ano", "chip": "2º", "pos": 2, "nome": "A Rua do Mundo", "trabalha": "Geografia: tipos de moradia — de que material, em que lugar e por quê, a casa vista de cima, como era antes e como é hoje (caderno de 25 folhas)", "pasta": "_casa1", "link": "https://vidalprof.github.io/tipos-de-moradia-2ano/", "painel": "", "tema": "A Rua do Mundo", "objetivo": "Ao final da aula, o estudante deverá ser capaz de:\n• entender para que serve a moradia, e cada cômodo dela;\n• reconhecer e nomear os tipos de moradia;\n• identificar de que material a morad function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }

/* ⚠️ COPIAR TEM DE FUNCIONAR NO CELULAR DA ESCOLA, e o `navigator.clipboard` só
   existe em https (ou localhost). Como o painel abre por https no Pages, o
   caminho normal funciona — mas se um dia ele abrir de outro jeito, o
   `execCommand` antigo salva. Sem o segundo caminho, o botão faria NADA e ele
   voltaria a me pedir o link, que é o problema que este painel resolve. */
function copiar(txt, bt){
  function feito(){
    var antes=bt.textContent; bt.textContent="✓ Copiado!"; bt.className="bt copiado";
    setTimeout(function(){ bt.textContent=antes; bt.className="bt"; }, 1600);
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(feito, function(){ velho(txt,feito); });
      return;
    }
  }catch(e){}
  velho(txt, feito);
}
function velho(txt, feito){
  try{
    var t=document.createElement("textarea");
    t.value=txt; t.setAttribute("readonly","");
    t.style.position="fixed"; t.style.left="-9999px";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0,99999);
    var ok=document.execCommand("copy"); document.body.removeChild(t);
    if(ok){ feito(); return; }
  }catch(e){}
  window.prompt("Copie o link:", txt);
}

var filtro="", turmaAtiva="";

function turmas(){
  var vistas=[], i;
  for(i=0;i<DADOS.length;i++) if(vistas.indexOf(DADOS[i].chip)<0) vistas.push(DADOS[i].chip);
  return vistas;
}

function desenhaChips(){
  var c=document.getElementById("chips"), ts=turmas(), h="";
  h+='<button class="chip" data-t="" aria-pressed="'+(turmaAtiva===""?"true":"false")+'">Todas</button>';
  for(var i=0;i<ts.length;i++)
    h+='<button class="chip" data-t="'+esc(ts[i])+'" aria-pressed="'+(turmaAtiva===ts[i]?"true":"false")+'">'+esc(ts[i])+'</button>';
  c.innerHTML=h;
  var bs=c.getElementsByClassName("chip");
  for(var j=0;j<bs.length;j++) bs[j].onclick=function(){
    turmaAtiva=this.getAttribute("data-t"); desenhaChips(); desenha();
  };
}

    if(a.turma!==turmaAnterior){ h+="<h2>"+esc(a.turma)+"</h2>"; turmaAnterior=a.turma; }
    h+='<div class="card"><div class="nome">'+esc(a.nome)+'</div>';
    if(a.trabalha) h+='<div class="trab">'+esc(a.trabalha)+'</div>';
    h+='<div class="acoes">';
    if(a.link){
      h+='<a class="bt abrir" href="'+esc(a.link)+'" target="_blank" rel="noopener">Abrir</a>';
      h+='<button class="bt" data-copiar="'+esc(a.link)+'">Copiar link</button>';
      if(a.painel) h+='<a class="bt prof" href="'+esc(a.painel)+'" target="_blank" rel="noopener">Painel do professor</a>';
    }else{
      h+='<span class="semlink">ainda não publicada</span>';
    }
    if(a.tema||a.objetivo) h+='<button class="bt" data-plano="'+i+'">Plano de aula</button>';
    h+="</div>";
    /* o tema e o objetivo, prontos para colar no planejamento da agenda */
    if(a.tema||a.objetivo){
      h+='<div class="plano" id="pl'+i+'">';
      if(!a.curriculo)
        h+='<div class="semcur">⚠️ Esta atividade ainda <b>não declara o currículo de Blumenau</b>. '
          +'O texto abaixo é o do catálogo — serve para o plano, mas <b>não é citação conferida</b>.</div>';
      if(a.tema){
        h+='<div class="pcampo"><div class="prot">Tema da aula</div>'
          +'<div class="ptxt uma">'+esc(a.tema)+'</div></div>';
      }
      if(a.objetivo){
        h+='<div class="pcampo"><div class="prot">Objetivo</div>'
          +'<div class="ptxt">'+esc(a.objetivo)+'</div></div>';
      }
      h+='<div class="acoes">';
      if(a.tema) h+='<button class="bt" data-cp="'+i+'" data-campo="tema">Copiar tema</button>';
      if(a.objetivo) h+='<button class="bt" data-cp="'+i+'" data-campo="objetivo">Copiar objetivo</button>';
      h+='</div></div>';
    }
    h+="</div>";
  }
  alvo.innerHTML=h;
  document.getElementById("vazio").style.display = n? "none":"block";
  var bs=alvo.querySelectorAll("[data-copiar]");
  for(var k=0;k<bs.length;k++) bs[k].onclick=function(){ copiar(this.getAttribute("data-copiar"), this); };
  /* ⚠️ O TEXTO COPIADO SAI DOS DADOS, não do que está desenhado na tela: o
     `innerText` de uma caixa que rola pode vir cortado ou com a quebra de linha
     do navegador, e aí o objetivo chegaria truncado no planejamento. */
  var cs=alvo.querySelectorAll("[data-cp]");
  for(var c=0;c<cs.length;c++) cs[c].onclick=function(){
    var d=DADOS[parseInt(this.getAttribute("data-cp"),10)];
    copiar(d[this.getAttribute("data-campo")]||"", this);
  };
  var ps=alvo.querySelectorAll("[data-plano]");
  for(var p=0;p<ps.length;p++) ps[p].onclick=function(){
    var cx=document.getElementById("pl"+this.getAttribute("data-plano"));
    if(!cx) return;
    var abrindo = cx.className.indexOf("aberto")<0;
    cx.className = abrindo ? "plano aberto" : "plano";
    this.textContent = abrindo ? "Fechar o plano" : "Plano de aula";
  };
}

document.getElementById("busca").oninput=function(){ filtro=this.value; desenha(); };
desenhaChips(); desenha();
</script>
